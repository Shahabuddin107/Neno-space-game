<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Space Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: #05050f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      background: #090a1a;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px #00f3ff;
      z-index: 10;
    }
    #speed-alert {
      position: absolute;
      top: 25%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 25;
    }
    #speed-alert.show {
      opacity: 1;
    }
    #level-up-banner {
      position: absolute;
      top: 32%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 20px #ffe600;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 25;
    }
    #level-up-banner.show {
      opacity: 1;
    }
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 15, 0.94);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
      z-index: 30;
      padding: 20px;
      text-align: center;
    }
    #game-over-screen h1 {
      font-size: 24px;
      color: #ff0055;
      margin-bottom: 8px;
    }
    #stats-box {
      font-size: 15px;
      margin-bottom: 12px;
      color: #00f3ff;
    }
    #gift-section {
      margin: 10px 0;
      cursor: pointer;
    }
    #mystery-box {
      font-size: 52px;
    }
    #reward-card {
      display: none;
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #ffe600;
      border-radius: 12px;
      padding: 10px 15px;
      margin-bottom: 14px;
    }
    #restart-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: transparent;
      border: 2px solid #00f3ff;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <div>SCORE: <span id="score-val">0</span></div>
      <div style="color:#ffd700">🟡 <span id="coins-val">0</span></div>
      <div style="color:#ffe600">LVL: <span id="level-val">1</span>/1000</div>
    </div>

    <div id="speed-alert">⚡ SPEED BOOST! ⚡</div>
    <div id="level-up-banner">LEVEL UP!</div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen">
      <h1>SYSTEM COMPROMISED</h1>
      <div id="stats-box">
        Level: <span id="final-level">1</span><br/>
        Coins: <span id="final-coins">0</span> 🟡<br/>
        Score: <span id="final-score">0</span>
      </div>

      <div id="gift-section">
        <div id="mystery-box">🎁</div>
        <div style="color:#ffe600; font-size:12px; margin-top:4px;">👉 TAP GIFT BOX 👈</div>
      </div>

      <div id="reward-card">
        <div id="reward-title" style="color:#ffe600; font-weight:bold; font-size:15px;"></div>
        <div id="reward-desc" style="font-size:12px; margin-top:3px;"></div>
      </div>

      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const container = document.getElementById("game-container");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function fitCanvas() {
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || window.innerHeight;
    }
    fitCanvas();
    window.addEventListener("resize", fitCanvas);

    const scoreVal = document.getElementById("score-val");
    const coinsVal = document.getElementById("coins-val");
    const levelVal = document.getElementById("level-val");
    const finalScoreVal = document.getElementById("final-score");
    const finalLevelVal = document.getElementById("final-level");
    const finalCoinsVal = document.getElementById("final-coins");
    const gameOverScreen = document.getElementById("game-over-screen");
    const restartBtn = document.getElementById("restart-btn");
    const levelUpBanner = document.getElementById("level-up-banner");
    const speedAlert = document.getElementById("speed-alert");
    const giftSection = document.getElementById("gift-section");
    const rewardCard = document.getElementById("reward-card");
    const rewardTitle = document.getElementById("reward-title");
    const rewardDesc = document.getElementById("reward-desc");

    let score = 0;
    let coins = 0;
    let level = 1;
    let isGameOver = false;
    let animationId;
    let frames = 0;
    let fireCooldown = 180;
    let gameStartTime = Date.now();
    let speedAlertTriggered = false;

    let audioCtx = null;
    function playSound(freq, duration, type = "sine") {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const player = {
      width: 42,
      height: 42,
      x: canvas.width / 2 - 21,
      y: canvas.height - 80,
      draw() {
        ctx.save();
        ctx.fillStyle = "#00f3ff";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00f3ff";
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    };

    const lasers = [];
    const enemies = [];
    const particles = [];
    const surpriseCoins = [];

    class Laser {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 3.5;
        this.speed = 10;
      }
      draw() {
        ctx.save();
        ctx.fillStyle = "#ffe600";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.y -= this.speed;
      }
    }

    class SurpriseCoin {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 8;
        this.speed = 2.2;
      }
      draw() {
        ctx.save();
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.y += this.speed;
      }
    }

    class Enemy {
      constructor() {
        this.radius = Math.random() * 8 + 14;
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = -this.radius;
        const elapsed = (Date.now() - gameStartTime) / 1000;
        const boost = elapsed > 10 ? 2.5 : 0;
        this.speed = Math.random() * 1.5 + 2.0 + boost + Math.min(level * 0.02, 5.0);
        this.color = Math.random() > 0.5 ? "#ff0055" : "#ff7700";
      }
      draw() {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      update() {
        this.y += this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2 + 1;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.alpha = 1;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
      }
    }

    function fireLaser() {
      lasers.push(new Laser(player.x + player.width / 2, player.y));
      playSound(750, 0.06, "square");
    }

    let touchFiring = null;
    function movePlayer(clientX) {
      const rect = canvas.getBoundingClientRect();
      player.x = (clientX - rect.left) - player.width / 2;
      if (player.x < 5) player.x = 5;
      if (player.x + player.width > canvas.width - 5) player.x = canvas.width - player.width - 5;
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      movePlayer(e.touches[0].clientX);
      fireLaser();
      if (!touchFiring) touchFiring = setInterval(fireLaser, fireCooldown);
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      movePlayer(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener("touchend", () => {
      clearInterval(touchFiring);
      touchFiring = null;
    });

    function checkLevelProgress() {
      const calcLvl = Math.min(1000, Math.floor(score / 40) + 1);
      if (calcLvl > level) {
        level = calcLvl;
        levelVal.innerText = level;
        levelUpBanner.innerText = `LEVEL ${level}!`;
        levelUpBanner.classList.add("show");
        playSound(900, 0.25, "triangle");
        setTimeout(() => levelUpBanner.classList.remove("show"), 1000);
      }
    }

    function openGift() {
      giftSection.style.display = "none";
      coins += 200;
      coinsVal.innerText = coins;
      rewardTitle.innerText = "🟡 +200 BONUS COINS!";
      rewardDesc.innerText = "Vault reward unlocked for your next game!";
      rewardCard.style.display = "block";
      playSound(1000, 0.3, "sine");
    }
    giftSection.addEventListener("click", openGift);
    giftSection.addEventListener("touchend", (e) => {
      e.preventDefault();
      openGift();
    });

    function endGame() {
      isGameOver = true;
      cancelAnimationFrame(animationId);
      clearInterval(touchFiring);
      touchFiring = null;
      finalScoreVal.innerText = score;
      finalLevelVal.innerText = level;
      finalCoinsVal.innerText = coins;
      giftSection.style.display = "block";
      rewardCard.style.display = "none";
      gameOverScreen.style.display = "flex";
    }

    function resetGame() {
      score = 0;
      level = 1;
      scoreVal.innerText = 0;
      levelVal.innerText = 1;
      lasers.length = 0;
      enemies.length = 0;
      particles.length = 0;
      surpriseCoins.length = 0;
      player.x = canvas.width / 2 - 21;
      isGameOver = false;
      gameStartTime = Date.now();
      speedAlertTriggered = false;
      gameOverScreen.style.display = "none";
      animate();
    }

    restartBtn.addEventListener("click", resetGame);
    restartBtn.addEventListener("touchend", (e) => {
      e.preventDefault();
      resetGame();
    });

    function animate() {
      if (isGameOver) return;
      animationId = requestAnimationFrame(animate);
      frames++;

      ctx.fillStyle = "rgba(9, 10, 26, 0.35)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      player.draw();

      const elapsed = (Date.now() - gameStartTime) / 1000;
      if (elapsed > 10 && !speedAlertTriggered) {
        speedAlertTriggered = true;
        speedAlert.classList.add("show");
        playSound(800, 0.3, "sawtooth");
        setTimeout(() => speedAlert.classList.remove("show"), 1200);
      }

      lasers.forEach((laser, idx) => {
        laser.update();
        laser.draw();
        if (laser.y < 0) lasers.splice(idx, 1);
      });

      surpriseCoins.forEach((coin, idx) => {
        coin.update();
        coin.draw();
        if (Math.hypot(player.x + player.width / 2 - coin.x, player.y + player.height / 2 - coin.y) < coin.radius + player.width / 2) {
          coins++;
          score += 50;
          coinsVal.innerText = coins;
          scoreVal.innerText = score;
          surpriseCoins.splice(idx, 1);
          playSound(1100, 0.1, "triangle");
        }
        if (coin.y > canvas.height) surpriseCoins.splice(idx, 1);
      });

      const rate = elapsed > 10 ? 30 : 55;
      if (frames % Math.max(16, rate - Math.floor(level * 0.05)) === 0) {
        enemies.push(new Enemy());
      }

      enemies.forEach((enemy, eIdx) => {
        enemy.update();
        enemy.draw();

        if (Math.hypot(player.x + player.width / 2 - enemy.x, player.y + player.height / 2 - enemy.y) < enemy.radius + player.width / 3) {
          endGame();
        }

        lasers.forEach((laser, lIdx) => {
          if (Math.hypot(laser.x - enemy.x, laser.y - enemy.y) < enemy.radius + laser.radius) {
            for (let i = 0; i < 10; i++) particles.push(new Particle(enemy.x, enemy.y, enemy.color));
            if (Math.random() < 0.35) surpriseCoins.push(new SurpriseCoin(enemy.x, enemy.y));
            enemies.splice(eIdx, 1);
            lasers.splice(lIdx, 1);
            score += 10;
            scoreVal.innerText = score;
            checkLevelProgress();
          }
        });

        if (enemy.y - enemy.radius > canvas.height) enemies.splice(eIdx, 1);
      });

      particles.forEach((p, idx) => {
        if (p.alpha <= 0) particles.splice(idx, 1);
        else { p.update(); p.draw(); }
      });
    }

    animate();
  </script>
</body>
</html>
