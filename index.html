<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Space Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: #05050f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.25);
      overflow: hidden;
      background: #090a1a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      pointer-events: none;
      text-shadow: 0 0 8px #00f3ff;
      z-index: 10;
    }
    .level-badge {
      color: #ffe600;
      text-shadow: 0 0 10px #ffe600;
    }
    .coin-badge {
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
    }
    #speed-alert {
      position: absolute;
      top: 25%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 18px #ff0055;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.35s ease;
      pointer-events: none;
      z-index: 25;
    }
    #speed-alert.show {
      opacity: 1;
      transform: scale(1.1);
    }
    #level-up-banner {
      position: absolute;
      top: 32%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 0 0 20px #ffe600, 0 0 40px #ff0055;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 25;
    }
    #level-up-banner.show {
      opacity: 1;
      transform: scale(1.1);
    }
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 15, 0.94);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      z-index: 30;
      padding: 20px;
      text-align: center;
    }
    #game-over-screen h1 {
      font-size: 26px;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      margin-bottom: 8px;
    }
    #stats-box {
      font-size: 15px;
      margin-bottom: 12px;
      color: #00f3ff;
      line-height: 1.5;
    }
    #gift-section {
      margin: 8px 0 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mystery-box {
      font-size: 58px;
      cursor: pointer;
      display: inline-block;
      animation: bounce 0.9s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
      filter: drop-shadow(0 0 20px #ffe600);
      transition: transform 0.2s;
    }
    #mystery-box:active {
      transform: scale(0.85);
    }
    @keyframes bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-16px) scale(1.08); }
    }
    #gift-hint {
      font-size: 13px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 8px #ffe600;
      margin-top: 6px;
    }
    #reward-card {
      display: none;
      background: rgba(255, 230, 0, 0.12);
      border: 2px solid #ffe600;
      box-shadow: 0 0 25px rgba(255, 230, 0, 0.4);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 16px;
      max-width: 90%;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #reward-title {
      font-size: 17px;
      font-weight: 900;
      color: #ffe600;
      margin-bottom: 4px;
    }
    #reward-desc {
      font-size: 13px;
      color: #ffffff;
      font-style: italic;
    }
    #restart-btn {
      padding: 12px 34px;
      font-size: 17px;
      font-weight: bold;
      color: #fff;
      background: transparent;
      border: 2px solid #00f3ff;
      border-radius: 30px;
      cursor: pointer;
      text-shadow: 0 0 8px #00f3ff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }
    #restart-btn:active {
      background: #00f3ff;
      color: #05050f;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <div>SCORE: <span id="score-val">0</span></div>
      <div class="coin-badge">🟡 <span id="coins-val">0</span></div>
      <div class="level-badge">LVL: <span id="level-val">1</span>/1000</div>
    </div>

    <div id="speed-alert">⚡ SPEED BOOST ACTIVATED! ⚡</div>
    <div id="level-up-banner">LEVEL UP!</div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen">
      <h1>SYSTEM COMPROMISED</h1>
      <div id="stats-box">
        Level Reached: <span id="final-level">1</span>/1000<br/>
        Surprise Coins: <span id="final-coins">0</span> 🟡<br/>
        Final Score: <span id="final-score">0</span>
      </div>

      <div id="gift-section">
        <div id="mystery-box">🎁</div>
        <div id="gift-hint">👉 TAP TO UNBOX SURPRISE! 👈</div>
      </div>

      <div id="reward-card">
        <div id="reward-title">⚡ SURPRISE UNLOCKED!</div>
        <div id="reward-desc">Enjoy your reward!</div>
      </div>

      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const container = document.getElementById("game-container");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const scoreVal = document.getElementById("score-val");
    const coinsVal = document.getElementById("coins-val");
    const levelVal = document.getElementById("level-val");
    const finalScoreVal = document.getElementById("final-score");
    const finalLevelVal = document.getElementById("final-level");
    const finalCoinsVal = document.getElementById("final-coins");
    const gameOverScreen = document.getElementById("game-over-screen");
    const restartBtn = document.getElementById("restart-btn");
    const levelUpBanner = document.getElementById("level-up-banner");
    const speedAlert = document.getElementById("speed-alert");

    const giftSection = document.getElementById("gift-section");
    const mysteryBox = document.getElementById("mystery-box");
    const rewardCard = document.getElementById("reward-card");
    const rewardTitle = document.getElementById("reward-title");
    const rewardDesc = document.getElementById("reward-desc");

    let score = 0;
    let coins = 0;
    let level = 1;
    let isGameOver = false;
    let animationId;
    let frames = 0;
    let fireCooldown = 180;
    let gameStartTime = Date.now();
    let speedAlertTriggered = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type = "sine") {
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCoinSound() {
      playSound(987, 0.08, "triangle");
      setTimeout(() => playSound(1318, 0.12, "sine"), 60);
    }

    const player = {
      width: 44,
      height: 44,
      x: canvas.width / 2 - 22,
      y: canvas.height - 85,
      speed: 7,
      dx: 0,
      draw() {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#00f3ff";
        ctx.fillStyle = "#00f3ff";
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      },
      update() {
        this.x += this.dx;
        if (this.x < 5) this.x = 5;
        if (this.x + this.width > canvas.width - 5) this.x = canvas.width - this.width - 5;
      }
    };

    const lasers = [];
    const enemies = [];
    const particles = [];
    const surpriseCoins = [];

    class Laser {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 3.5;
        this.speed = 11;
      }
      draw() {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ffe600";
        ctx.fillStyle = "#ffe600";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.y -= this.speed;
      }
    }

    class SurpriseCoin {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 8;
        this.speed = 2.4;
      }
      draw() {
        ctx.save();
        ctx.shadowBlur = 14;
        ctx.shadowColor = "#ffd700";
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
      update() {
        this.y += this.speed;
      }
    }

    class Enemy {
      constructor() {
        this.radius = Math.random() * 10 + 15;
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = -this.radius;

        // 10 Second rule: agar 10s ho gaye to extra speed
        const elapsedSec = (Date.now() - gameStartTime) / 1000;
        const tenSecBonus = elapsedSec > 10 ? 2.5 : 0;
        const levelBonus = Math.min(level * 0.02, 6.0);

        this.speed = Math.random() * 1.6 + 2.0 + tenSecBonus + levelBonus;
        this.color = Math.random() > 0.4 ? "#ff0055" : (Math.random() > 0.5 ? "#ff7700" : "#a855f7");
      }
      draw() {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      update() {
        this.y += this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2.5 + 1;
        this.color = color;
        this.velocity = {
          x: (Math.random() - 0.5) * 6,
          y: (Math.random() - 0.5) * 6
        };
        this.alpha = 1;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.025;
      }
    }

    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.6,
      speed: Math.random() * 1.2 + 0.6
    }));

    function drawStars() {
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.y += star.speed;
        if (star.y > canvas.height) star.y = 0;
      });
    }

    function fireLaser() {
      lasers.push(new Laser(player.x + player.width / 2, player.y));
      playSound(780, 0.07, "square");
    }

    // Touch & Drag Controls
    let touchFiringInterval = null;
    function handleTouchMove(e) {
      if (isGameOver) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const touchX = touch.clientX - rect.left;
      player.x = touchX - player.width / 2;
      if (player.x < 5) player.x = 5;
      if (player.x + player.width > canvas.width - 5) player.x = canvas.width - player.width - 5;
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleTouchMove(e);
      fireLaser();
      if (!touchFiringInterval) {
        touchFiringInterval = setInterval(fireLaser, fireCooldown);
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      handleTouchMove(e);
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      clearInterval(touchFiringInterval);
      touchFiringInterval = null;
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
      if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
      if (e.key === " " || e.key === "ArrowUp") fireLaser();
    });

    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "ArrowRight", "a", "d"].includes(e.key)) player.dx = 0;
    });

    function triggerExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push(new Particle(x, y, color));
      }
      playSound(120, 0.2, "sawtooth");
    }

    function checkLevelProgress() {
      const calculatedLevel = Math.min(1000, Math.floor(score / 40) + 1);
      if (calculatedLevel > level) {
        level = calculatedLevel;
        levelVal.innerText = level;
        levelUpBanner.innerText = `LEVEL ${level} REACHED!`;
        levelUpBanner.classList.add("show");
        playSound(950, 0.35, "triangle");
        setTimeout(() => levelUpBanner.classList.remove("show"), 1200);
      }
    }

    const surpriseGifts = [
      {
        title: "🟡 500 SURPRISE COINS CASH-IN!",
        desc: "Special Vault Opened: +500 Coins added directly to your treasury!",
        apply: () => { coins += 500; coinsVal.innerText = coins; }
      },
      {
        title: "⚡ ULTRA HYPER-BLASTER (+35% SPEED)!",
        desc: "Alien Overdrive: Continuous fast-shooting unlocked for next run!",
        apply: () => { fireCooldown = 115; }
      },
      {
        title: "🛡️ MYSTIC TITANIUM SHIELD!",
        desc: "Space Guardian blessing: Next run fortified with glowing golden energy aura!",
        apply: () => {}
      },
      {
        title: "🚀 GALAXY ACE STAR BADGE!",
        desc: "Special achievement: You are now in the top 1% galaxy pilots!",
        apply: () => {}
      }
    ];

    function openSurpriseGift() {
      playSound(1046, 0.35, "sine");
      giftSection.style.display = "none";

      const selected = surpriseGifts[Math.floor(Math.random() * surpriseGifts.length)];
      rewardTitle.innerText = selected.title;
      rewardDesc.innerText = selected.desc;
      rewardCard.style.display = "block";
      selected.apply();

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle(canvas.width / 2, canvas.height / 2, ["#ffd700", "#00f3ff", "#ff0055", "#00ff66"][Math.floor(Math.random() * 4)]));
      }
    }

    mysteryBox.addEventListener("click", openSurpriseGift);
    mysteryBox.addEventListener("touchend", (e) => {
      e.preventDefault();
      openSurpriseGift();
    });

    function endGame() {
      isGameOver = true;
      cancelAnimationFrame(animationId);
      clearInterval(touchFiringInterval);
      touchFiringInterval = null;

      finalScoreVal.innerText = score;
      finalLevelVal.innerText = level;
      finalCoinsVal.innerText = coins;

      giftSection.style.display = "flex";
      rewardCard.style.display = "none";
      gameOverScreen.style.display = "flex";
    }

    function resetGame() {
      score = 0;
      level = 1;
      scoreVal.innerText = 0;
      levelVal.innerText = 1;
      lasers.length = 0;
      enemies.length = 0;
      particles.length = 0;
      surpriseCoins.length = 0;
      player.x = canvas.width / 2 - 22;
      isGameOver = false;
      gameStartTime = Date.now();
      speedAlertTriggered = false;
      gameOverScreen.style.display = "none";
      animate();
    }

    restartBtn.addEventListener("click", resetGame);
    restartBtn.addEventListener("touchend", (e) => {
      e.preventDefault();
      resetGame();
    });

    function animate() {
      if (isGameOver) return;
      animationId = requestAnimationFrame(animate);
      frames++;

      ctx.fillStyle = "rgba(9, 10, 26, 0.32)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStars();
      player.update();
      player.draw();

      // 10 Second Speed Boost Alert Check
      const elapsed = (Date.now() - gameStartTime) / 1000;
      if (elapsed > 10 && !speedAlertTriggered) {
        speedAlertTriggered = true;
        speedAlert.classList.add("show");
        playSound(850, 0.4, "sawtooth");
        setTimeout(() => speedAlert.classList.remove("show"), 1500);
      }

      lasers.forEach((laser, index) => {
        laser.update();
        laser.draw();
        if (laser.y < 0) lasers.splice(index, 1);
      });

      // Surprise Coins Movement & Collection
      surpriseCoins.forEach((coin, cIndex) => {
        coin.update();
        coin.draw();

        // Player Coin Touch Collision
        const distToPlayer = Math.hypot(
          player.x + player.width / 2 - coin.x,
          player.y + player.height / 2 - coin.y
        );
        if (distToPlayer < coin.radius + player.width / 2) {
          playCoinSound();
          coins += 1;
          coinsVal.innerText = coins;
          score += 50;
          scoreVal.innerText = score;
          surpriseCoins.splice(cIndex, 1);
        }

        if (coin.y > canvas.height) surpriseCoins.splice(cIndex, 1);
      });

      // 10 second ke baad spawn rate bhi fast
      const rateBase = elapsed > 10 ? 32 : 55;
      const spawnRate = Math.max(15, rateBase - Math.floor(level * 0.05));
      if (frames % spawnRate === 0) {
        enemies.push(new Enemy());
      }

      enemies.forEach((enemy, eIndex) => {
        enemy.update();
        enemy.draw();

        const distToPlayer = Math.hypot(
          player.x + player.width / 2 - enemy.x,
          player.y + player.height / 2 - enemy.y
        );
        if (distToPlayer < enemy.radius + player.width / 3) {
          triggerExplosion(player.x, player.y, "#00f3ff");
          endGame();
        }

        lasers.forEach((laser, lIndex) => {
          const dist = Math.hypot(laser.x - enemy.x, laser.y - enemy.y);
          if (dist < enemy.radius + laser.radius) {
            triggerExplosion(enemy.x, enemy.y, enemy.color);

            // 40% Chance to drop Golden Surprise Coin
            if (Math.random() < 0.4) {
              surpriseCoins.push(new SurpriseCoin(enemy.x, enemy.y));
            }

            enemies.splice(eIndex, 1);
            lasers.splice(lIndex, 1);
            score += 10;
            scoreVal.innerText = score;
            checkLevelProgress();
          }
        });

        if (enemy.y - enemy.radius > canvas.height) {
          enemies.splice(eIndex, 1);
        }
      });

      par
